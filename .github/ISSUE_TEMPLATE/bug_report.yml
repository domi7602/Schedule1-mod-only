name: Bug Report
description: Report a mod bug or crash
labels: [bug]
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Which mod is affected?
      placeholder: NotesApp / PotScanner / BankApp / ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Mod version (UserData\<Mod>\mod.json or MelonLoader console) + game version (MelonLoader console at startup)
      placeholder: NotesApp v1.0.3 / Schedule I v0.4.6f13
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce
      placeholder: 1. Start game, 2. Open phone, 3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Latest.log excerpt
      description: Relevant lines from <GameDir>\MelonLoader\Latest.log — search for the mod name and ERROR/Exception (see docs/troubleshooting.md)
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual
      placeholder: "Expected: ... Actual: ..."
