name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate (format, tests, SLN, docs)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Contract tests read source from the pinned public submodules.
          submodules: recursive

      - name: Setup .NET 8 SDK and .NET 6 runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify repository
        shell: pwsh
        run: |
          $scratch = Join-Path $env:LOCALAPPDATA 'Schedule1Tools/verification'
          "VERIFY_ARTIFACTS=$scratch" >> $env:GITHUB_ENV
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          # Hosted runners select Pure. A configured runner with game references
          # selects Full. Both use the same local entry point, with no deployment.
          pwsh -NoProfile -ExecutionPolicy Bypass -File Tools/verify.ps1 -Mode Auto -DotnetPath $dotnet -ScratchRoot $scratch
          exit $LASTEXITCODE

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            ${{ env.VERIFY_ARTIFACTS }}/verify-*/report.json
            ${{ env.VERIFY_ARTIFACTS }}/verify-*/*.log
            ${{ env.VERIFY_ARTIFACTS }}/verify-*/tests/**/*.trx
            ${{ env.VERIFY_ARTIFACTS }}/verify-*/tests/**/*.log
          if-no-files-found: warn
