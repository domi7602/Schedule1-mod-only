name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # Spiel-Assemblies (MelonLoader/Il2CppAssemblies) existieren nur mit
      # installiertem Schedule I (lokal / self-hosted Runner). Build + Tests
      # laufen nur dann; Restore, Format und SLN-Determinismus laufen immer.
      # Aufloesung spiegelt Directory.Build.props (SCHEDULE1_PATH sonst Default).
      - name: Detect game assemblies
        id: detect
        shell: pwsh
        run: |
          $gameDir = if ($env:SCHEDULE1_PATH) { $env:SCHEDULE1_PATH } else { 'C:\Program Files (x86)\Steam\steamapps\common\Schedule I' }
          $probe = Join-Path $gameDir 'MelonLoader\Il2CppAssemblies\Assembly-CSharp.dll'
          $hasGame = Test-Path -LiteralPath $probe
          "has-game=$($hasGame.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($hasGame) {
            Write-Host "Game assemblies found ($gameDir) — full validation."
          } else {
            Write-Host "No game assemblies — build/tests will be skipped (see AGENTS.md)."
          }

      - name: Restore
        run: dotnet restore Source/Mods/S1Mods.sln

      - name: dotnet format --verify-no-changes
        run: dotnet format Source/Mods/S1Mods.sln --verify-no-changes --verbosity diagnostic

      - name: Build (Release)
        if: steps.detect.outputs.has-game == 'true'
        run: dotnet build Source/Mods/S1Mods.sln -c Release --no-restore --nologo

      - name: Tests
        if: steps.detect.outputs.has-game == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "Source/Tests")) {
            Write-Host "Source/Tests not found — skip."
            exit 0
          }
          $failed = $false
          Get-ChildItem -Path "Source/Tests" -Recurse -Filter "*.csproj" | ForEach-Object {
            dotnet test $_.FullName -c Release --nologo
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "All test projects passed."

      - name: No game assemblies — limited validation
        if: steps.detect.outputs.has-game != 'true'
        shell: pwsh
        run: |
          Write-Host "Schedule I ist auf diesem Runner nicht installiert: Build + Tests uebersprungen."
          Write-Host "Volle Validierung braucht Spiel-Assemblies (lokal bauen oder self-hosted Runner). Siehe AGENTS.md."

      # Vergleich normalisiert Zeilenenden: Der Runner checkt mit LF aus, das
      # Skript schreibt CRLF — ohne Normalisierung waere der Hash-Check
      # checkout-abhaengig. Es zaehlt der Inhalt (GUIDs, Projektliste).
      - name: Check S1Mods.sln determinism
        shell: pwsh
        run: |
          $before = ((Get-Content -LiteralPath "Source/Mods/S1Mods.sln" -Raw) -replace "`r?`n", "`n")
          pwsh Tools/gen-sln.ps1
          $after = ((Get-Content -LiteralPath "Source/Mods/S1Mods.sln" -Raw) -replace "`r?`n", "`n")
          if ($before -cne $after) {
            Write-Error "S1Mods.sln is not deterministic! Run pwsh Tools/gen-sln.ps1 and commit."
            git diff -- Source/Mods/S1Mods.sln
            exit 1
          }
          Write-Host "S1Mods.sln deterministic OK."

      # Knowledge-XRef-Check entfernt 2026-09-10: Der Knowledge-Workspace
      # existiert nach der Neuinstallation nicht mehr (siehe AGENTS.md §7).
      # Skript bei Bedarf aus der Historie:
      #   git show 891c330^:Tools/fix-knowledge-paths.ps1

      - name: Verify mod versions in sync (bump-version dry-run)
        shell: pwsh
        run: |
          Write-Host "Version sync is enforced via bump-version.ps1 — manual check TODO (ensure AGENTS.md matches mod.json)."
          # Optional: add script to compare AGENTS.md vs mod.json versions

  s1interop:
    runs-on: windows-latest
    timeout-minutes: 10
    if: false # enable when s1interop is available in CI (requires game assemblies)
    steps:
      - uses: actions/checkout@v4
      - name: s1interop analyze
        run: |
          s1interop analyze Source/Mods/Shared/src/Shared.csproj
