name: Release

permissions:
  contents: read

# Release packaging is manual-only and only works on a runner that has
# Schedule I installed (IL2CPP game assemblies under MelonLoader\Il2CppAssemblies).
# GitHub-hosted runners never have the game, so package-release.ps1 fails fast
# there by design. The former tag-push trigger was removed on 2026-09-16 because
# it failed on every v* tag for exactly that reason. Use "Run workflow" on a
# self-hosted Windows runner, or run Tools/package-release.ps1 locally
# (see docs/release-process.md).
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Mod to package (All for all mods)"
        required: false
        default: "All"

jobs:
  package:
    name: Package release ZIPs
    runs-on: [self-hosted, Windows, schedule1]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 8 SDK and .NET 6 runtime
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      # Fail fast with a clear message instead of deep inside the packaging script.
      - name: Require game assemblies
        shell: pwsh
        run: |
          $gameDir = if ($env:SCHEDULE1_PATH) { $env:SCHEDULE1_PATH } else { 'C:\Program Files (x86)\Steam\steamapps\common\Schedule I' }
          $probe = Join-Path $gameDir 'MelonLoader\Il2CppAssemblies\Assembly-CSharp.dll'
          if (-not (Test-Path -LiteralPath $probe)) {
            Write-Error "Schedule I is not installed on this runner ($probe). Release packaging needs a self-hosted runner with the game and `$env:SCHEDULE1_PATH. See docs/release-process.md."
            exit 1
          }
          Write-Host "Game assemblies found ($gameDir)."

      - name: Package (Tools/package-release.ps1)
        shell: pwsh
        env:
          # CI must never write into the local game installation (self-hosted runner).
          S1NoDeploy: "true"
          RELEASE_MOD: ${{ inputs.mod }}
        run: |
          $mod = $env:RELEASE_MOD
          if ([string]::IsNullOrWhiteSpace($mod)) { $mod = "All" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File Tools/package-release.ps1 -Mod $mod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release ZIPs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: Release/*.zip
          if-no-files-found: error
